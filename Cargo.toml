[package]
name = "smartxfer"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "smartxfer"
path = "src/bin/smartxfer.rs"

[[bin]]
name = "durasend"
path = "src/bin/durasend.rs"

[dependencies]
clap = { version = "=4.4.18", features = ["derive"] }
blake3 = "=1.5.4"
zstd = "0.13"
orion = "=0.17.6"
rand = "0.8"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "=1.7.0"
getrandom = "=0.2.15"
